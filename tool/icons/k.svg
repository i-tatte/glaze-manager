    <rect x="71" y="26" width="12" height="54" rx="6"/>
  </g>
  <!-- アクセントは1本だけ -->
  <rect x="59" y="-6" width="6" height="56" rx="3" fill="url(#am)"/>
  <rect x="8" y="7" width="20" height="4.5" rx="2.25" fill="#FFFFFF" opacity="0.4" transform="rotate(-18 18 9)"/>
