      <stop offset="0" stop-color="#0F3238"/><stop offset="1" stop-color="#0A1E22"/>
    </linearGradient>
    <linearGradient id="gz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DEBC8"/><stop offset="1" stop-color="#0FA0AE"/>
    </linearGradient>
    <linearGradient id="am" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC24B"/><stop offset="1" stop-color="#E8842E"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <g fill="#07555E">
    <path d="M0,49 C8,55 16,44 26,49 C36,54 44,44 54,48 C66,53 76,44 88,48 C92,49 96,48 100,46 L100,10 L0,10 Z"/>
