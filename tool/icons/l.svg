<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- 案L 壺・藍単色: 藍1色相の濃淡 + 生成りのニュートラル -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2246"/><stop offset="1" stop-color="#101228"/>
    </linearGradient>
    <linearGradient id="gz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E9BFF"/><stop offset="1" stop-color="#2D4FD6"/>
    </linearGradient>
    <clipPath id="pot">
      <path d="M39,14 h22 v9 c0,5 15,9 15,29 a26,26 0 0 1 -52,0 c0,-20 15,-24 15,-29 z"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <ellipse cx="50" cy="80" rx="29" ry="4.5" fill="#000000" opacity="0.35" filter="url(#soft)"/>
  <path d="M39,14 h22 v9 c0,5 15,9 15,29 a26,26 0 0 1 -52,0 c0,-20 15,-24 15,-29 z" fill="#F5EDDC"/>
  <g clip-path="url(#pot)">
    <rect x="60" y="0" width="40" height="100" fill="#D9C5A4" opacity="0.7" filter="url(#soft)"/>
    <g fill="#1E3A9E">
      <path d="M0,47 C12,52 24,42 38,47 C52,52 64,42 78,46 C86,48 94,46 100,45 L100,10 L0,10 Z"/>
      <rect x="46" y="26" width="9" height="34" rx="4.5"/>
      <rect x="63" y="26" width="7" height="26" rx="3.5"/>
    </g>
    <g fill="url(#gz)">
      <path d="M0,44 C12,49 24,39 38,44 C52,49 64,39 78,43 C86,45 94,43 100,42 L100,0 L0,0 Z"/>
      <rect x="45" y="22" width="9" height="35" rx="4.5"/>
      <rect x="62" y="22" width="7" height="27" rx="3.5"/>
    </g>
    <rect x="41" y="16" width="3.5" height="17" rx="1.75" fill="#FFFFFF" opacity="0.55" transform="rotate(6 42 24)"/>
    <circle cx="47" cy="38" r="1.8" fill="#FFFFFF" opacity="0.5"/>
  </g>
</svg>
