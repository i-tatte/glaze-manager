<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- 案R 施釉の刷毛跡: 明地にティールのひと塗り + 滴 -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#FAF5E9"/><stop offset="1" stop-color="#EBDFC4"/>
    </radialGradient>
    <linearGradient id="gz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DEBC8"/><stop offset="1" stop-color="#0E8F9E"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <g transform="rotate(-8 50 44)">
    <!-- 上端から画面外につながる「ひと塗り」。濃色の縁を下にずらして厚みを出す -->
    <g fill="#07555E">
      <rect x="37" y="-14" width="26" height="72" rx="13"/>
      <rect x="41" y="36" width="7" height="30" rx="3.5"/>
      <rect x="53" y="36" width="6" height="22" rx="3"/>
    </g>
    <g fill="url(#gz)">
      <rect x="37" y="-14" width="26" height="69" rx="13"/>
      <rect x="41" y="33" width="7" height="30" rx="3.5"/>
      <rect x="53" y="33" width="6" height="22" rx="3"/>
    </g>
    <rect x="42" y="6" width="3.2" height="18" rx="1.6" fill="#FFFFFF" opacity="0.5"/>
  </g>
  <!-- 飛んだ一滴 -->
  <path d="M73,64 c0,0 -5.5,7 -5.5,11 a5.5,5.5 0 0 0 11,0 c0,-4 -5.5,-11 -5.5,-11 z" fill="#0A7480"/>
  <path d="M73,62.5 c0,0 -5.5,7 -5.5,11 a5.5,5.5 0 0 0 11,0 c0,-4 -5.5,-11 -5.5,-11 z" fill="url(#gz)"/>
  <circle cx="71" cy="73" r="1.6" fill="#FFFFFF" opacity="0.5"/>
</svg>
