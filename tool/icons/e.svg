<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- 案E 釉流れタイル: 暗色地に多色の釉薬が流れ落ちる -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31374A"/><stop offset="1" stop-color="#14161E"/>
    </linearGradient>
    <linearGradient id="glaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#49EFC9"/><stop offset="1" stop-color="#0E9FAE"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD34E"/><stop offset="1" stop-color="#F08A2E"/>
    </linearGradient>
    <linearGradient id="cobalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E9BFF"/><stop offset="1" stop-color="#2D4FD6"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <!-- 濃色の縁: 本体を下にずらしたコピーで釉溜まりの厚みを出す -->
  <g fill="#086A75">
    <path d="M0,49 C8,55 16,44 26,49 C36,54 44,44 54,48 C66,53 76,44 88,48 C92,49 96,48 100,46 L100,10 L0,10 Z"/>
    <rect x="16" y="30" width="13" height="41" rx="6.5"/>
    <rect x="44" y="30" width="9" height="31" rx="4.5"/>
    <rect x="72" y="30" width="12" height="53" rx="6"/>
  </g>
  <!-- 釉薬本体 -->
  <g fill="url(#glaze)">
    <path d="M0,46 C8,52 16,41 26,46 C36,51 44,41 54,45 C66,50 76,41 88,45 C92,46 96,45 100,43 L100,0 L0,0 Z"/>
    <rect x="15" y="26" width="13" height="42" rx="6.5"/>
    <rect x="43" y="26" width="9" height="32" rx="4.5"/>
    <rect x="71" y="26" width="12" height="54" rx="6"/>
  </g>
  <!-- 上から流した別色の釉 -->
  <rect x="33" y="-6" width="7" height="60" rx="3.5" fill="url(#amber)"/>
  <rect x="59" y="-6" width="5" height="56" rx="2.5" fill="url(#cobalt)"/>
  <!-- 光沢 -->
  <rect x="8" y="7" width="20" height="4.5" rx="2.25" fill="#FFFFFF" opacity="0.45" transform="rotate(-18 18 9)"/>
  <circle cx="31" cy="13" r="2" fill="#FFFFFF" opacity="0.55"/>
</svg>
